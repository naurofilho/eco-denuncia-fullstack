# Publicação no Render, plano gratuito: a API Django e o site React.
# O banco fica no Neon e as fotos no Cloudflare R2. Passo a passo em DEPLOY.md.
services:
  # API Django. Só refaz o deploy quando algo muda em backend/.
  - type: web
    name: eco-denuncia-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    # O plano gratuito não roda comandos antes do deploy, então as migrações rodam no build.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn ecodenuncia.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Os valores abaixo são pedidos na tela quando o Blueprint é criado.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FOTOS_BUCKET
        sync: false
      - key: FOTOS_ENDPOINT
        sync: false
      - key: FOTOS_ACCESS_KEY_ID
        sync: false
      - key: FOTOS_SECRET_ACCESS_KEY
        sync: false

  # Site React. Arquivos estáticos não dormem: a página abre na hora.
  - type: web
    name: eco-denuncia
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
    # As rotas do React (/entrar, /painel...) são resolvidas no navegador.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: VITE_SITE_DEMO
        value: "1"
      - key: VITE_API_URL
        sync: false
